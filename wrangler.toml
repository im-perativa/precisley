# Workers Builds: build `npm run build`, deploy `npx wrangler deploy`, Node 20.
# Static SPA in dist/ plus a tiny /api/utc that uses Cloudflare's clock.
name = "precisley"
main = "worker.ts"
compatibility_date = "2026-09-21"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
